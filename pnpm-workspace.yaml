packages:
  - "apps/*"
  - "packages/*"

onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@swc/core"
  - argon2
  - esbuild
  - sharp
  - unrs-resolver

confirmModulesPurge: false

overrides:
  uuid: 11.1.1
  exceljs@4.4.0>unzipper: 0.12.5

minimumReleaseAgeExclude:
  - icu-minify@4.14.3
  - next-intl-swc-plugin-extractor@4.14.3
  - next-intl@4.14.3
  - use-intl@4.14.3

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  argon2: true
  esbuild: true
  sharp: true
  unrs-resolver: true
